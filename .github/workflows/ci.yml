name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-checks:
    name: Rust Quality Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --workspace --all-features

  frontend-checks:
    name: Frontend Quality Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Svelte Type Check
        run: npm run check --workspace=apps/web

      - name: Prettier Format Check
        run: npm run format --workspace=apps/web

      - name: Vitest Frontend Tests
        run: npm run test --workspace=apps/web

  docker-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t loglens:test .

      - name: Test Docker Compose Startup
        run: |
          cp .env.example .env
          docker compose up -d
          sleep 10
          docker compose ps
          curl -f http://localhost:8080/api/v1/health || exit 1
          curl -f http://localhost:8080/api/v1/ready || exit 1
          docker compose down -v
