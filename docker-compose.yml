version: '3.8'

services:
  loglens:
    build:
      context: .
      dockerfile: Dockerfile
    image: loglens:latest
    container_name: loglens
    ports:
      - "8080:8080"
    environment:
      - LOGLENS_HOST=0.0.0.0
      - LOGLENS_PORT=8080
      - LOGLENS_DATABASE_URL=sqlite:///data/loglens.db
      - LOGLENS_DATA_DIR=/data
      - LOGLENS_SESSION_SECRET=${LOGLENS_SESSION_SECRET:-change-this-session-secret-min-32-bytes-long!}
    volumes:
      - loglens_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  loglens_data:
